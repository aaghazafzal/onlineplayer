name = "jiosaavn-player-api"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Per-IP rate limit for /api/resolve (Workers Rate Limiting API, no KV writes)
[[ratelimits]]
name = "RESOLVE_LIMITER"
namespace_id = "4001"
simple = { limit = 60, period = 60 }

# Custom Domain for the JioSaavn worker
[[routes]]
pattern = "jiosaavn.onlineplayer.site"
custom_domain = true
